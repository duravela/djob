syntax = "proto3";

package runtime;

import "common/v1/common.proto";

option go_package = "github.com/duravela/djob/pkg/proto/runtime/v1;runtime";

service Admin {
    rpc InvokeService(InvokeServiceRequest) returns (common.InvokeResponse) {}
}

// InvokeServiceRequest represents the request message for Service invocation.
message InvokeServiceRequest {
  // Required. Callee's app id.
  string id = 1;

  // Required. message which will be delivered to callee.
  common.InvokeRequest message = 3;
}